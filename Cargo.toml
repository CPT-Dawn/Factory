[workspace]
resolver = "3"
members = ["crates/factory-core", "crates/factory-adapters", "crates/factory"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "MIT OR Apache-2.0"
repository = "https://github.com/CPT-Dawn/Factory"
publish = false

[workspace.dependencies]
factory-core = { path = "crates/factory-core" }
factory-adapters = { path = "crates/factory-adapters" }
clap = { version = "4.6", features = ["derive"] }
listenfd = "1"
rustix = { version = "1", features = ["process", "fs"] }
serde = { version = "1", features = ["derive"] }
signal-hook = "0.3"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "macros", "process", "signal"] }
regex = "1"
rusqlite = { version = "0.43", features = ["bundled"] }
proptest = "1"
toml = "1.2"
jiff = "1"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
